<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Agent status</title>
<style>
  /* The window is deliberately larger than the bubble: it stays transparent
     and click-through until the pointer is over the orb, then it expands to
     show the agent's latest message. Nothing here may paint a background —
     the desktop must show through. */
  :root { color-scheme: dark; }
  html, body { height: 100%; margin: 0; background: transparent; overflow: hidden; }
  body { font: 13px/1.4 'Avenir UI', 'Segoe UI', system-ui, sans-serif; -webkit-user-select: none; user-select: none; }
  .bubble {
    position: absolute; right: 10px; bottom: 10px;
    display: flex; align-items: center; gap: 10px;
    max-width: calc(100% - 20px);
    opacity: .52; transition: opacity .22s ease;
    cursor: pointer;
  }
  .bubble:hover, .bubble.is-open { opacity: 1; }
  .bubble-msg {
    display: flex; flex-direction: column; gap: 1px; min-width: 0;
    max-width: 0; overflow: hidden;
    padding: 0; border: 0; border-radius: 14px; background: transparent;
    opacity: 0; transform: translateX(6px);
    transition: max-width .24s ease, opacity .18s ease, transform .24s ease,
                padding .24s ease, background .24s ease, box-shadow .24s ease;
  }
  .bubble.is-open .bubble-msg {
    max-width: 268px; padding: 8px 13px; background: #0d1416f2;
    box-shadow: 0 10px 30px #000000a6, 0 0 0 1px #2a3538;
    opacity: 1; transform: none;
  }
  .bubble-title { color: #8fa0a3; font-size: 10px; letter-spacing: .06em; text-transform: uppercase; }
  .bubble-text {
    display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3;
    overflow: hidden; color: #e8efef; font-size: 12.5px; line-height: 1.4;
    overflow-wrap: anywhere;
  }
  .bubble-orb { position: relative; display: grid; flex: none; place-items: center; width: 62px; height: 62px; }
  .bubble-halo {
    position: absolute; inset: -12px; border-radius: 50%;
    background: radial-gradient(circle, #c8ff0030, transparent 66%);
    filter: blur(3px); transition: background .45s ease;
  }
  .bubble canvas { position: relative; display: block; }
  .bubble[data-mode="deep"] .bubble-halo { background: radial-gradient(circle, #96f0ff2e, transparent 66%); }
  .bubble[data-mode="planning"] .bubble-halo { background: radial-gradient(circle, #c8ff0026, transparent 66%); }
  .bubble[data-mode="acting"] .bubble-halo { background: radial-gradient(circle, #c8ff0040, transparent 68%); }
  .bubble[data-mode="waiting"] .bubble-halo { background: radial-gradient(circle, #ffc45038, transparent 66%); }
  .bubble[data-mode="error"] .bubble-halo { background: radial-gradient(circle, #ef4f6450, transparent 66%); }
  .bubble[data-mode="done"] .bubble-halo { background: radial-gradient(circle, #6ee7a530, transparent 66%); }
  .bubble[data-mode="waiting"] .bubble-title { color: #d8b273; }
  .bubble[data-mode="error"] .bubble-title { color: #ff9da8; }
  .bubble[data-mode="done"] .bubble-title { color: #7fe0aa; }
</style>
</head>
<body>
  <div class="bubble" id="bubble" data-mode="thinking" role="button" tabindex="-1" aria-label="Agent status. Click to open Browser-use.">
    <div class="bubble-msg">
      <span class="bubble-title" id="bubble-title">Working</span>
      <span class="bubble-text" id="bubble-text"></span>
    </div>
    <div class="bubble-orb">
      <span class="bubble-halo"></span>
      <canvas id="bubble-canvas"></canvas>
    </div>
  </div>
  <script src="../renderer/agentOrb.js"></script>
  <script src="workingBubble.js"></script>
</body>
</html>
