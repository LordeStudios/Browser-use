<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<title>Cannot Connect</title>
<style>
  :root {
    --bg: #0f1117; --surface: #181b23; --card: #1e222d;
    --text: #e8eaf0; --text-dim: #8b92a5; --text-faint: #5a6178;
    --accent: #c8ff00; --red: #ff5c5c; --orange: #ff8c42;
    --font: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  ::selection { background: var(--accent); color: #000; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
  body { background: var(--bg); color: var(--text); font-family: var(--font); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
  .container { text-align: center; max-width: 560px; padding: 40px; }
  .icon { font-size: 80px; margin-bottom: 24px; }
  h1 { font-size: 28px; font-weight: 700; margin-bottom: 12px; }
  .url-bar {
    background: var(--card); border: 1px solid rgba(255,255,255,0.08); border-radius: 10px;
    padding: 12px 18px; margin: 20px auto; max-width: 400px; font-size: 13px; color: var(--text-faint);
    word-break: break-all; text-align: left;
  }
  .sub { color: var(--text-dim); font-size: 16px; line-height: 1.6; margin-bottom: 32px; }
  .actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  .btn {
    display: inline-flex; align-items: center; gap: 8px;
    border: none; border-radius: 50px; padding: 13px 28px; font-size: 14px; font-weight: 600;
    cursor: pointer; transition: transform 0.15s;
  }
  .btn:hover { transform: scale(1.05); }
  .btn-primary { background: var(--accent); color: #000; }
  .btn-secondary { background: var(--card); color: var(--text); border: 1px solid rgba(255,255,255,0.1); }
  .btn svg { width: 16px; height: 16px; }
  .details { margin-top: 32px; text-align: left; background: var(--card); border-radius: 12px; padding: 18px 22px; border: 1px solid rgba(255,255,255,0.06); }
  .details summary { cursor: pointer; font-size: 13px; color: var(--text-dim); font-weight: 600; }
  .details pre { margin-top: 12px; font-size: 12px; color: var(--text-faint); line-height: 1.6; white-space: pre-wrap; word-break: break-all; }
</style>
</head>
<body>
  <div class="container">
    <div class="icon"><svg width="80" height="80" viewBox="0 0 64 64" fill="none"><circle cx="32" cy="32" r="28" stroke="#ff5c5c" stroke-width="3" opacity="0.3"/><path d="M20 28h8v-6a4 4 0 018 0v6h8a2 2 0 012 2v4a10 10 0 01-10 10h-2v8a2 2 0 01-2 2h-4a2 2 0 01-2-2v-8h-2a10 10 0 01-10-10v-4a2 2 0 012-2z" stroke="#ff5c5c" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><line x1="20" y1="20" x2="44" y2="44" stroke="#ff5c5c" stroke-width="3" stroke-linecap="round"/></svg></div>
    <h1>Cannot Connect</h1>
    <div class="sub">The browser can't reach this website. It may be temporarily unavailable, or the address may have changed.</div>
    <div class="url-bar" id="urlDisplay">https://...</div>
    <div class="actions">
      <button class="btn btn-primary" id="retry-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M23 4v6h-6"/><path d="M20.49 15a9 9 0 11-2.12-9.36L23 10"/></svg>
        Try Again
      </button>
      <button class="btn btn-secondary" onclick="history.back()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        Go Back
      </button>
    </div>
    <details class="details">
      <summary>Technical details</summary>
      <pre id="errorDetails">The server may be down, the DNS lookup may have failed, or the connection may have timed out. Check the URL and try again.</pre>
    </details>
  </div>
  <script>
    const params = new URLSearchParams(location.search);
    const url = params.get('url') || document.referrer || 'Unknown URL';
    document.getElementById('urlDisplay').textContent = url;
    const errorCode = params.get('code') || '';
    const errorMsg = params.get('message') || '';
    if (errorCode || errorMsg) {
      document.getElementById('errorDetails').textContent = `Error code: ${errorCode}\n${errorMsg}`;
    }
  </script>

<script>
  // LORDE_ERROR_RETRY_V2 — the failed URL arrives in the query string. The
  // old Try Again used location.reload(), which only reloaded this error
  // page itself and left the user stuck. Retry now returns to the failed
  // address; the page also shows the failed URL and the network error.
  (function () {
    var q = new URLSearchParams(location.search);
    var target = q.get('url') || '';
    var message = q.get('message') || '';
    var code = q.get('code') || '';
    var urlEl = document.querySelector('[data-failed-url]');
    if (urlEl) urlEl.textContent = target || 'Unknown address';
    var msgEl = document.querySelector('[data-error-message]');
    if (msgEl && message) msgEl.textContent = message + (code ? ' (error ' + code + ')' : '');
    var retry = document.getElementById('retry-btn');
    if (retry) retry.addEventListener('click', function () {
      if (target && /^https?:\/\//i.test(target)) location.href = target;
      else location.reload();
    });
    var home = document.getElementById('home-btn');
    if (home) home.addEventListener('click', function () { location.href = q.get('home') || '/'; });
    if (target) {
      var info = document.createElement('div');
      info.style.cssText = 'margin-top:22px;font-size:13px;line-height:1.6;color:#8b92a5;word-break:break-all;';
      var label = document.createElement('div');
      label.textContent = 'Address: ' + target;
      info.appendChild(label);
      if (message) {
        var m = document.createElement('div');
        m.style.marginTop = '4px';
        m.textContent = message + (code ? ' (error ' + code + ')' : '');
        info.appendChild(m);
      }
      var container = document.querySelector('.container') || document.body;
      container.appendChild(info);
    }
  })();
</script>
</body>
</html>
