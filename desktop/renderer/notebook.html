<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Run Notebook</title>
  <link rel="stylesheet" href="chrome-theme.css">
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body { margin: 0; height: 100vh; display: flex; flex-direction: column; background: var(--bu-canvas, #060b0d); color: var(--bu-text, #e6edf0); font: 13px/1.45 system-ui, "Segoe UI", sans-serif; }
    .notebook-header { display: flex; align-items: center; gap: .6rem; padding: .45rem .7rem; border-bottom: 1px solid rgba(255,255,255,.08); background: var(--bu-chrome, #0a1113); }
    .notebook-header strong { font-size: .78rem; letter-spacing: .04em; text-transform: uppercase; }
    .notebook-path { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: .72rem; color: var(--bu-muted, #7c8b91); direction: rtl; text-align: left; }
    .notebook-status { font-size: .72rem; color: var(--bu-muted, #7c8b91); min-width: 90px; text-align: right; }
    .notebook-editor { flex: 1; min-height: 0; margin: 0; padding: .6rem .7rem; border: 0; resize: none; background: transparent; color: inherit; font: 12.5px/1.55 Consolas, "Cascadia Mono", monospace; outline: none; }
    .notebook-footer { display: flex; align-items: center; gap: .5rem; padding: .5rem .7rem; border-top: 1px solid rgba(255,255,255,.08); background: var(--bu-chrome, #0a1113); }
    .notebook-hint { flex: 1; font-size: .7rem; color: var(--bu-muted, #7c8b91); }
    .plain-button { background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.12); color: inherit; border-radius: 6px; padding: .3rem .75rem; font-size: .75rem; cursor: pointer; }
    .plain-button:hover { background: rgba(255,255,255,.12); }
    .plain-button.primary { background: #9fd12a; border-color: #9fd12a; color: #0a1113; font-weight: 600; }
    .plain-button.primary:disabled { opacity: .5; cursor: default; }
    .notebook-error { color: #ff7b6b; }
  </style>
</head>
<body>
  <div class="notebook-header">
    <strong>Run Notebook</strong>
    <span class="notebook-path" id="notebookPath"></span>
    <span class="notebook-status" id="notebookStatus"></span>
  </div>
  <textarea class="notebook-editor" id="notebookEditor" spellcheck="false"></textarea>
  <div class="notebook-footer">
    <span class="notebook-hint">USER sections are yours; agent sections keep their entries when you save. The agent re-reads this file before every decision.</span>
    <button class="plain-button" id="notebookReload">Reload</button>
    <button class="plain-button primary" id="notebookSave" disabled>Save</button>
  </div>
  <script>
    // The notebook popup: load the file, edit, Save (merge — user sections
    // verbatim, agent sections preserved), Reload discards local edits.
    (function () {
      var params = new URLSearchParams(location.search);
      var notebookPath = params.get('notebookPath') || '';
      var editor = document.getElementById('notebookEditor');
      var saveButton = document.getElementById('notebookSave');
      var reloadButton = document.getElementById('notebookReload');
      var status = document.getElementById('notebookStatus');
      var pathLabel = document.getElementById('notebookPath');

      function setStatus(text, isError) {
        status.textContent = text;
        status.classList.toggle('notebook-error', Boolean(isError));
      }

      function load() {
        if (!notebookPath) { setStatus('no notebook active', true); return; }
        pathLabel.textContent = notebookPath;
        window.browserUseDesktop.notebookRead(notebookPath).then(function (result) {
          if (!result || result.ok === false) { setStatus(result && result.error ? result.error : 'read failed', true); return; }
          editor.value = result.content || '';
          setStatus('loaded');
        }).catch(function (error) { setStatus(String(error && error.message || error), true); });
      }

      saveButton.addEventListener('click', function () {
        if (!notebookPath) return;
        saveButton.disabled = true;
        setStatus('saving…');
        window.browserUseDesktop.notebookSave(notebookPath, editor.value).then(function (result) {
          if (!result || result.ok === false) { setStatus(result && result.error ? result.error : 'save failed', true); return; }
          setStatus('saved');
        }).catch(function (error) { setStatus(String(error && error.message || error), true); })
          .finally(function () { saveButton.disabled = false; });
      });
      reloadButton.addEventListener('click', load);
      editor.addEventListener('input', function () { setStatus('edited'); });

      // Another surface opened a different notebook: swap the file in place.
      if (window.browserUseDesktop.onNotebookLoad) {
        window.browserUseDesktop.onNotebookLoad(function (payload) {
          notebookPath = String((payload && payload.path) || notebookPath);
          load();
        });
      }
      if (window.browserUseDesktop.onNotebookSaved) {
        window.browserUseDesktop.onNotebookSaved(function (payload) {
          if (String((payload && payload.path) || '') === notebookPath) setStatus('saved');
        });
      }
      load();
    })();
  </script>
</body>
</html>
