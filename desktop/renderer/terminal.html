<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Browser-use Terminal</title>
  <link rel="stylesheet" href="vendor/xterm.css">
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body { margin: 0; height: 100vh; display: flex; flex-direction: column; background: var(--bu-canvas); color: var(--bu-text); font: 13px/1.4 system-ui, "Segoe UI", sans-serif; }
    .terminal-header { display: flex; align-items: center; gap: .6rem; padding: .45rem .7rem; border-bottom: 1px solid rgba(255,255,255,.08); background: var(--bu-chrome); }
    .terminal-header strong { font-size: .78rem; letter-spacing: .04em; text-transform: uppercase; color: var(--bu-text); }
    .terminal-backend { font-size: .72rem; color: var(--bu-muted); }
    .terminal-actions { margin-left: auto; display: flex; gap: .35rem; }
    .plain-button { background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.12); color: var(--bu-text); border-radius: 6px; padding: .25rem .6rem; font-size: .75rem; cursor: pointer; }
    .plain-button:hover { background: rgba(255,255,255,.12); }
    .terminal-surface { flex: 1; min-height: 0; padding: .4rem .5rem; }
  </style>
  <link rel="stylesheet" href="chrome-theme.css">
</head>
<body>
  <div class="terminal-header">
    <strong>Terminal</strong>
    <span class="terminal-backend" id="terminal-backend"></span>
    <div class="terminal-actions">
      <button class="plain-button" id="terminal-screenshot" type="button" title="Capture the page and copy the file path">Screenshot</button>
      <button class="plain-button" id="terminal-select" type="button" title="Pick an element in the page and insert its selector">Select</button>
      <button class="plain-button" id="terminal-reset" type="button" title="Restart the shell in this terminal">Reset</button>
    </div>
  </div>
  <div class="terminal-surface" id="terminal-surface"></div>
  <script src="vendor/xterm.js"></script>
  <script src="vendor/addon-fit.js"></script>
  <script src="terminal.js"></script>
  <script src="terminalWindow.js"></script>
</body>
</html>
