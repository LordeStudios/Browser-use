<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>browser-use data grid fixture</title>
<style>
 body { font-family: system-ui, sans-serif; max-width: 720px; margin: 2rem auto; padding: 0 1rem; }
 table { border-collapse: collapse; width: 100%; margin-top: 1rem; }
 th, td { border: 1px solid #ccc; padding: 0.5rem; text-align: left; }
 th { cursor: pointer; background: #f5f5f5; }
 .selected { background: #e6f3ff; }
 .pagination { margin-top: 1rem; }
 .pagination button { margin: 0 0.25rem; }
 .stats { margin-top: 1rem; font-weight: bold; }
 .hidden { display: none; }
</style>
</head>
<body>
<h1>Orders</h1>
<input id="search" type="text" placeholder="Search customer..."/>
<table>
  <thead><tr><th id="sort-id">ID</th><th>Customer</th><th id="sort-total">Total</th><th>Status</th></tr></thead>
  <tbody id="rows"></tbody>
</table>
<div class="pagination">
  <button id="prev-page">Prev</button>
  <span id="page-info"></span>
  <button id="next-page">Next</button>
</div>
<div class="stats" id="stats"></div>
<script>
const all = Array.from({length:32},(_,i)=>({id:i+1,customer:'Customer '+(i+1),total:(i+1)*123+1000,status:['Pending','Shipped','Delivered'][i%3]}));
let sortKey='id', sortAsc=true, page=1, pageSize=5, search='';
function render(){
  let rows = all.filter(r=>r.customer.toLowerCase().includes(search.toLowerCase()));
  rows.sort((a,b)=>{
    const av=a[sortKey], bv=b[sortKey];
    return sortAsc ? (av>bv?1:-1) : (av<bv?1:-1);
  });
  const totalPages = Math.max(1, Math.ceil(rows.length/pageSize));
  if(page>totalPages) page=totalPages;
  const pageRows = rows.slice((page-1)*pageSize, page*pageSize);
  document.getElementById('rows').innerHTML = pageRows.map(r=>`<tr id="row-${r.id}"><td>${r.id}</td><td>${r.customer}</td><td>$${r.total}</td><td>${r.status}</td></tr>`).join('');
  document.getElementById('page-info').textContent = `Page ${page} of ${totalPages}`;
  document.getElementById('stats').textContent = `Showing ${pageRows.length} of ${rows.length} orders`;
}
document.getElementById('search').addEventListener('input', e=>{ search=e.target.value; page=1; render(); });
document.getElementById('sort-id').addEventListener('click',()=>{ sortKey='id'; sortAsc=!sortAsc; render(); });
document.getElementById('sort-total').addEventListener('click',()=>{ sortKey='total'; sortAsc=!sortAsc; render(); });
document.getElementById('prev-page').addEventListener('click',()=>{ if(page>1){ page--; render(); }});
document.getElementById('next-page').addEventListener('click',()=>{ page++; render(); });
render();
</script>
</body>
</html>
